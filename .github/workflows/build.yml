name: Build

on:
  push:
  pull_request:

jobs:

  bash:
    strategy:
      matrix:
        image: [
            "debian:bookworm",
            "debian:trixie",
            "debian:sid",
            "ubuntu:jammy",
            "ubuntu:noble",
            "ubuntu:oracular",
            "ubuntu:plucky"
        ]

    name: Build Source Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Bootstrap
        run: |
          scripts/debian/docker_bootstrap-image.sh \
            amd64 $(echo ${{ matrix.image }} | tr ':' ' ')
