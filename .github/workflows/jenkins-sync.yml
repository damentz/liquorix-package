name: Jenkins Sync

# The Jenkins jobs hold their pipeline script inline.  Keep them equal to the
# Jenkinsfiles on the default branch.
on:
  push:
    branches: ['[0-9]*.[0-9]*/master']
    paths:
      - 'scripts/jenkins/**'
      - 'scripts/*/Jenkinsfile'
      - '.github/workflows/jenkins-sync.yml'
  workflow_dispatch:

jobs:
  sync:
    name: Push Jenkinsfiles
    # Only the newest series drives Jenkins, an older series must not overwrite it
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write the job scripts
        env:
          JENKINS_URL: https://liquorix.net/jenkins
          JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_API_KEY: ${{ secrets.JENKINS_API_KEY }}
        run: scripts/jenkins/push-jobs.py
