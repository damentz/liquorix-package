name: Lint

on:
  push:
  pull_request:

jobs:

  bash:
    name: Lint Bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        run: |
          find . -type f -name "*.sh" -print0 |\
          xargs -0 shellcheck scripts/version
      - name: Check release version consistency
        run: make check-version
      - name: Run script tests
        run: make test

  ruff:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Oldest Python among the releases built in scripts/debian/env.sh
      # (Ubuntu jammy); bump when jammy is dropped.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          # launchpadlib is imported by scripts/debian/delete_ppa_packages.py;
          # pylint needs it importable to resolve the module.
          pip install ruff black pylint launchpadlib

      - name: Run ruff
        run: ruff check --output-format=github

      - name: Run black
        run: black --check --diff .

      - name: Run pylint
        run: |
          find . -type f -name "*.py" -print0 |\
          xargs -0 pylint --disable=C,R
